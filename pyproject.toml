[project]
name = "jcol"
version = "0.1.0"
description = "Type a column header in plain English; watch it fill. A demonstration of TypeSafe's Jev decision model."
readme = "README.md"
license = "MIT"
authors = [{ name = "Khaled Eltokhy" }]
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=12",
    "polars>=1.0",
]

[project.scripts]
jcol = "jcol.app:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jcol"]

[tool.uv.workspace]
members = []
