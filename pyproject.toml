[project]
name = "jcol"
version = "0.5.0"
description = "Apply natural-language codebooks to tables, with resumable annotation and label evaluation."
readme = "README.md"
license = "MIT"
authors = [{ name = "Khaled Eltokhy" }]
requires-python = ">=3.10"
dependencies = [
    "jevkit-runtime[http2]>=0.3.0,<0.4.0",
    "httpx[http2]>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "websockets>=12",
    "polars>=1.0",
]

[project.urls]
Repository = "https://github.com/keltokhy/jcol"
Issues = "https://github.com/keltokhy/jcol/issues"

[project.scripts]
jcol = "jcol.cli:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jcol"]

[tool.uv.workspace]
members = []

[tool.uv.sources]
jevkit-runtime = { path = "../jevkit-core", editable = true }
